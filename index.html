<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARQ IA 3D</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    ARQ<span>IA</span> 3D
  </div>

  <button id="camera">
    🎥 Visão externa
  </button>
</header>


<aside>

  <h1>Monte sua casa</h1>

  <p>
    Configure o terreno e gere uma proposta
    de arquitetura em 3D.
  </p>


  <label>
    Largura do terreno (m)

    <input
      id="w"
      type="number"
      value="10"
      min="4"
      max="100"
      step="0.5"
    >
  </label>


  <label>
    Comprimento do terreno (m)

    <input
      id="d"
      type="number"
      value="20"
      min="5"
      max="100"
      step="0.5"
    >
  </label>


  <label>
    Quartos

    <input
      id="q"
      type="number"
      value="3"
      min="1"
      max="8"
    >
  </label>


  <label>
    Banheiros

    <input
      id="b"
      type="number"
      value="2"
      min="1"
      max="5"
    >
  </label>


  <label>
    Garagem

    <select id="g">

      <option value="0">
        Sem garagem
      </option>

      <option value="1" selected>
        1 carro
      </option>

      <option value="2">
        2 carros
      </option>

      <option value="3">
        3 carros
      </option>

    </select>

  </label>


  <label class="check">
    <input
      id="pool"
      type="checkbox"
    >

    Piscina
  </label>


  <label class="check">
    <input
      id="gourmet"
      type="checkbox"
    >

    Área gourmet
  </label>


  <button id="generate">
    ✨ GERAR CASA 3D
  </button>


  <button id="reset">
    ↺ Resetar câmera
  </button>


  <div id="status">
    Pronto para gerar.
  </div>

</aside>


<main id="view"></main>


<div class="hint">
  🖱️ Arraste para girar •
  roda para zoom •
  toque no celular
</div>


<script
  type="module"
  src="script.js">
</script>

</body>
</html>
